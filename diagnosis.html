<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS files/style.css">
</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🌿 Ayurvedic Expert System</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="diagnosis.html">Diagnosis</a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- Form -->

<div class="container mt-5">

    <div class="card shadow p-4 reveal">

        <h2 class="text-center text-success mb-4">
            Ayurvedic Diagnosis Form
        </h2>

        <form id="diagnosisForm">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Age</label>
                    <input type="number" id="age" class="form-control" required>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Gender</label>

                    <select id="gender" class="form-select">
                        <option>Male</option>
                        <option>Female</option>
                    </select>

                </div>

            </div>

            <hr>

            <h4 class="text-success">Symptoms</h4>

            <div class="row">

                <div class="col-md-6">

                    <label>Dry Skin</label>
                    <select id="drySkin" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                    <label>Constipation</label>
                    <select id="constipation" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                    <label>Cold Hands & Feet</label>
                    <select id="cold" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                    <label>Anxiety</label>
                    <select id="anxiety" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                    <label>Joint Pain</label>
                    <select id="joint" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                </div>

                <div class="col-md-6">

                    <label>Body Heat</label>
                    <select id="heat" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                    <label>Strong Digestion</label>
                    <select id="digestion" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                    <label>High Weight</label>
                    <select id="weight" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                    <label>Laziness</label>
                    <select id="lazy" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                    <label>Heavy Sleep</label>
                    <select id="sleep" class="form-select mb-3">
                        <option>No</option>
                        <option>Yes</option>
                    </select>

                </div>

            </div>

            <div class="text-center mt-4">

                <button type="button"
                    class="btn btn-success btn-lg"
                    onclick="diagnose()">

                    Analyze Dosha

                </button>

            </div>

        </form>

    </div>

</div>

<script src="../js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/animations.js"></script>

</body>

</html>
