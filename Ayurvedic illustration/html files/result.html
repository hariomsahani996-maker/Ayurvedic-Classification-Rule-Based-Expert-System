<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diagnosis Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../CSS files/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">

🌿 Ayurvedic Expert System

</a>

</div>

</nav>

<div class="container mt-5">

<div class="card shadow-lg p-5">

<h2 class="text-center text-success mb-4">

Diagnosis Result

</h2>

<div class="row">

<div class="col-md-6">

<h5>Name</h5>
<p id="name"></p>

<h5>Age</h5>
<p id="age"></p>

<h5>Gender</h5>
<p id="gender"></p>

</div>

<div class="col-md-6">

<h5>Primary Dosha</h5>

<h3 class="class=text-center text-success" id="dosha"></h3>

</div>

</div>

<hr>

<h4 class="class=text-center text-success">

Dosha Scores

</h4>

<div class="progress mb-3">

<div id="vataBar"
class="progress-bar bg-warning"
style="width:0%">
0%
</div>

</div>

<div class="progress mb-3">

<div id="pittaBar"
class="progress-bar bg-danger"
style="width:0%">
0%
</div>

</div>

<div class="progress mb-4">

<div id="kaphaBar"
class="progress-bar bg-success"
style="width:0%">
0%
</div>

</div>

<h4>Description</h4>

<p id="description"></p>

<hr>

<h4 class="text-success">

Recommended Diet

</h4>

<p id="diet"></p>

<hr>

<h4 class="text-danger">

Foods to Avoid

</h4>

<p id="avoid"></p>

<div class="text-center mt-5">

<button class="btn btn-success me-3"

onclick="window.print()">

🖨 Print Report

</button>

<a href="diagnosis.html"

class="btn btn-primary">

New Diagnosis

</a>

</div>

</div>

</div>

<script>

document.getElementById("name").innerHTML =
localStorage.getItem("name");

document.getElementById("age").innerHTML =
localStorage.getItem("age");

document.getElementById("gender").innerHTML =
localStorage.getItem("gender");

document.getElementById("dosha").innerHTML =
localStorage.getItem("dosha");

document.getElementById("description").innerHTML =
localStorage.getItem("description");

document.getElementById("diet").innerHTML =
localStorage.getItem("diet");

document.getElementById("avoid").innerHTML =
localStorage.getItem("avoid");

let v=parseInt(localStorage.getItem("vata"));
let p=parseInt(localStorage.getItem("pitta"));
let k=parseInt(localStorage.getItem("kapha"));

let total=v+p+k;

if(total==0)
total=1;

let vp=Math.round((v/total)*100);
let pp=Math.round((p/total)*100);
let kp=Math.round((k/total)*100);

document.getElementById("vataBar").style.width=vp+"%";
document.getElementById("vataBar").innerHTML=vp+"%";

document.getElementById("pittaBar").style.width=pp+"%";
document.getElementById("pittaBar").innerHTML=pp+"%";

document.getElementById("kaphaBar").style.width=kp+"%";
document.getElementById("kaphaBar").innerHTML=kp+"%";

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
